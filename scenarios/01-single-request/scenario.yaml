kind: Scenario
name: llama-3.1-8b-instruct-a100-sxm-tp1
engine:
  kind: vllm
  version: "0.32.0"

model: llama-3.1-8b-instruct
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: a100-sxm
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: llama-3.1-8b-instruct-a100-sxm-tp1

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 1
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      block_size: 16
      max_model_len: 8192
