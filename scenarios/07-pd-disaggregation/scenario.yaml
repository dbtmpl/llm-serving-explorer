kind: Scenario
name: llama-3.1-70b-instruct-h100-3p1d-ib
engine:
  kind: vllm
  version: "0.32.0"

model: llama-3.1-70b-instruct
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-fabric]

cluster:
  hardware: h100
  fabric: ib-400g
  nodes: 4
  gpus_per_node: 8
---
kind: Deployment
name: llama-3.1-70b-instruct-h100-3p1d-ib

pools:
  - role: prefill
    nodes: 3
    parallel:
      tp: 2
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9
  - role: decode
    nodes: 1
    parallel:
      tp: 2
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      quantization: fp8
      kv_cache_dtype: fp8
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      max_model_len: 32768
      gpu_memory_utilization: 0.9

pd_transfer:
  connector: NixlConnector

router:
  endpoint_picker_config: router.yaml
