kind: Scenario
name: llama-3.1-8b-instruct-a100-sxm-offload
engine:
  kind: vllm
  version: "0.32.0"

model: llama-3.1-8b-instruct
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory, cost-model-offload-tiers]

cluster:
  hardware: a100-sxm
  nodes: 1
  gpus_per_node: 8
---
kind: Deployment
name: llama-3.1-8b-instruct-a100-sxm-offload

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 1
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      block_size: 16
      max_model_len: 8192
      gpu_memory_utilization: 0.25

offload:
  connector: OffloadingConnector
  spec: TieringOffloadingSpec
  eviction_policy: lru
  tiers:
    - tier: cpu_dram
      bytes: 4294967296
