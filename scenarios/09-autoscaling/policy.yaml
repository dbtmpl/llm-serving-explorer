node_pools:
  - name: pool-a100
    gpu_type: a100-sxm
    gpus_per_node: 8
    gpu_memory_gib: 80.0
    initial_nodes: 2
    min_nodes: 1
    max_nodes: 2
    cost_per_hour: 20.0
instance_lifecycle:
  loading_delay:
    mean: 0.5
    stddev: 0.0
  warm_start_initial_instances: true
autoscaler:
  interval_us: 1000000
  scale_up_stabilization_window_us: 1000000
  scale_down_stabilization_window_us: 1000000
  analyzer:
    kv_cache_threshold: 0.5
    scale_up_threshold: 0.5
    scale_down_boundary: 0.4
    avg_input_tokens: 1000
    min_replicas: 1
