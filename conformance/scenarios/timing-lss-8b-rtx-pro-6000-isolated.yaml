id: timing-lss-8b-rtx-pro-6000-isolated
title: Held-out timing, Llama 3.1 8B on one RTX PRO 6000, one request at a time
references: [llmservingsim]
# Four requests 15 s apart, each alone on the engine: prompts of 300 to 6,000 tokens (different from the calibration scenario's 128 to 8,000) and answers of 200. Time to first token is the prefill of one prompt plus fixed
# overheads, time per token a decode step at batch 1. Two readings of timing, kept apart (default-* and fitted-*).
model: llama-3.1-8b
gpu: rtx-pro-6000
engine:
  tp: 1
  gpu_memory_utilisation: 0.92
  max_num_seqs: 64
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
  async_scheduling: true
replicas: 1
routing: round-robin
requests:
  - { session: 1, at: 1.0, turns: [[300, 200]] }
  - { session: 2, at: 16.0, turns: [[1500, 200]] }
  - { session: 3, at: 31.0, turns: [[3000, 200]] }
  - { session: 4, at: 46.0, turns: [[6000, 200]] }
checks:
  - id: default-ttft-mean
    claim: "Mean time to first token, the site's default parameters (no fit), agrees with LLMServingSim."
    kind: calibrated
    metric: ttft_mean_s
    rel_tol: 0.3
    params: defaults
    tolerance: "30 percent: the standard the BLIS timing checks use for time to first token; queueing amplifies a step-cost error into the wait."
    known_difference:
      reference: llmservingsim
      cause: "Front-end tokenisation LLMServingSim lacks, and prefill at default MFU"
      reason: >-
        At the site's default parameters the model's mean time to first token is 180 ms against LLMServingSim's 121 ms (+48 percent). About 41 ms of it is the model's front end, which assembles and
        tokenises every prompt (30 ms plus 4 microseconds per token for the prompts of this scenario) and which LLMServingSim does not model; without it the model would give about 139 ms (+15
        percent), the rest being prefill priced at MFU 0.7 of the catalogue's peak where LLMServingSim sums per-layer kernel times profiled on this GPU. With parameters fitted to LLMServingSim's
        calibration scenarios the model gives 161 ms, of which the same 41 ms is the front end (fitted-ttft-mean). A first-token time this short is mostly fixed overhead, so a fixed 41 ms is a large
        share of it.
      differences:
        value: { typescript: 0.18, llmservingsim: 0.1213 }
  - id: default-tpot-mean
    claim: "Mean time per output token, the site's default parameters (no fit), agrees with LLMServingSim."
    kind: calibrated
    metric: tpot_mean_s
    rel_tol: 0.12
    params: defaults
    tolerance: "12 percent: the standard the BLIS timing checks use for time per token (memory-bound decoding, the best-conditioned timing)."
    known_difference:
      reference: llmservingsim
      cause: "At batch 1 the default launch cost and MBU add 1.5 ms to a profiled 11.6 ms step"
      reason: >-
        At the site's default parameters (MBU 0.85) a decode step of one sequence reads the 16.06 GB of weights at 0.85 of 1,597 GB/s, 11.8 ms, adds 1.0 ms to launch 32 layers and a little host
        time: 13.1 ms per output token against LLMServingSim's 11.6 ms (+13.5 percent). LLMServingSim's step at batch 1 is the sum of per-layer kernel times profiled on this GPU, equivalent to about
        0.87 of the datasheet bandwidth with no separate launch cost. The launch term (BLIS's assumed value, unverified) is most of the excess at batch 1; at the larger batches of the real run the
        same defaults are within 6 percent (measured-8b-rtx-pro-6000). Fitted to the calibration scenarios the check holds.
      differences:
        value: { typescript: 0.01313, llmservingsim: 0.01156 }
  - id: default-e2e-mean
    claim: "Mean end-to-end time, the site's default parameters (no fit), agrees with LLMServingSim."
    kind: calibrated
    metric: e2e_mean_s
    rel_tol: 0.15
    params: defaults
    tolerance: "15 percent: the standard the BLIS timing checks use for end-to-end time."
    known_difference:
      reference: llmservingsim
      cause: "Follows the default time per token and the front end"
      reason: >-
        End-to-end time is the first token plus about 200 decode steps: the model's 2.79 s against LLMServingSim's 2.42 s (+15.3 percent, against a tolerance of 15) is the 1.5 ms per step of the
        time-per-token check over 199 steps (0.31 s) and the 59 ms of the first-token check. Fitted to the calibration scenarios the check holds.
      differences:
        value: { typescript: 2.792, llmservingsim: 2.422 }
  - id: default-throughput
    claim: "Output tokens per second over the run, the site's default parameters (no fit), agrees with LLMServingSim."
    kind: calibrated
    metric: throughput_tokens_per_s
    rel_tol: 0.1
    params: defaults
    tolerance: "10 percent: the standard the BLIS timing checks use for throughput; the load is open loop, so throughput differs only through how late the last answers finish."
  - id: fitted-ttft-mean
    claim: "Mean time to first token, parameters fitted to the calibration scenarios calib-lss-8b-rtx-pro-6000-*, agrees with LLMServingSim."
    kind: calibrated
    metric: ttft_mean_s
    rel_tol: 0.3
    params: fitted
    tolerance: "30 percent: the standard the BLIS timing checks use for time to first token; queueing amplifies a step-cost error into the wait."
    known_difference:
      reference: llmservingsim
      cause: "Front-end tokenisation LLMServingSim lacks"
      reason: >-
        With parameters fitted to LLMServingSim's calibration scenarios the model's mean time to first token is 161 ms against 121 ms (+32.7 percent). About 41 ms is the model's front end (30 ms
        plus 4 microseconds per token), which LLMServingSim does not model; without it the two agree to about 1 percent. A fit of the step cost cannot absorb a fixed cost that only the first token
        pays (see default-ttft-mean).
      differences:
        value: { typescript: 0.161, llmservingsim: 0.1213 }
  - id: fitted-tpot-mean
    claim: "Mean time per output token, parameters fitted to the calibration scenarios calib-lss-8b-rtx-pro-6000-*, agrees with LLMServingSim."
    kind: calibrated
    metric: tpot_mean_s
    rel_tol: 0.12
    params: fitted
    tolerance: "12 percent: the standard the BLIS timing checks use for time per token (memory-bound decoding, the best-conditioned timing)."
  - id: fitted-e2e-mean
    claim: "Mean end-to-end time, parameters fitted to the calibration scenarios calib-lss-8b-rtx-pro-6000-*, agrees with LLMServingSim."
    kind: calibrated
    metric: e2e_mean_s
    rel_tol: 0.15
    params: fitted
    tolerance: "15 percent: the standard the BLIS timing checks use for end-to-end time."
  - id: fitted-throughput
    claim: "Output tokens per second over the run, parameters fitted to the calibration scenarios calib-lss-8b-rtx-pro-6000-*, agrees with LLMServingSim."
    kind: calibrated
    metric: throughput_tokens_per_s
    rel_tol: 0.1
    params: fitted
    tolerance: "10 percent: the standard the BLIS timing checks use for throughput; the load is open loop, so throughput differs only through how late the last answers finish."
