id: timing-lss-8b-rtx-pro-6000-burst
title: Held-out timing, Llama 3.1 8B on one RTX PRO 6000, a burst of 32 requests
references: [llmservingsim]
# Thirty-two identical requests (1,500 prompt tokens, 200 answer tokens) at the same instant, as in timing-8b-h100-burst: the batch goes from 0 to 32, then drains. Held out from the calibration scenarios.
# Two readings of timing, kept apart (default-* and fitted-*), as in timing-lss-8b-rtx-pro-6000-chat. The prompts are identical in content by construction only in length: the translator gives every request fresh token ids, so no prefix is shared.
model: llama-3.1-8b
gpu: rtx-pro-6000
engine:
  tp: 1
  gpu_memory_utilisation: 0.92
  max_num_seqs: 64
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
  async_scheduling: true
replicas: 1
routing: round-robin
requests:
  - { session: 1, at: 1.00, turns: [[1500, 200]] }
  - { session: 2, at: 1.00, turns: [[1500, 200]] }
  - { session: 3, at: 1.00, turns: [[1500, 200]] }
  - { session: 4, at: 1.00, turns: [[1500, 200]] }
  - { session: 5, at: 1.00, turns: [[1500, 200]] }
  - { session: 6, at: 1.00, turns: [[1500, 200]] }
  - { session: 7, at: 1.00, turns: [[1500, 200]] }
  - { session: 8, at: 1.00, turns: [[1500, 200]] }
  - { session: 9, at: 1.00, turns: [[1500, 200]] }
  - { session: 10, at: 1.00, turns: [[1500, 200]] }
  - { session: 11, at: 1.00, turns: [[1500, 200]] }
  - { session: 12, at: 1.00, turns: [[1500, 200]] }
  - { session: 13, at: 1.00, turns: [[1500, 200]] }
  - { session: 14, at: 1.00, turns: [[1500, 200]] }
  - { session: 15, at: 1.00, turns: [[1500, 200]] }
  - { session: 16, at: 1.00, turns: [[1500, 200]] }
  - { session: 17, at: 1.00, turns: [[1500, 200]] }
  - { session: 18, at: 1.00, turns: [[1500, 200]] }
  - { session: 19, at: 1.00, turns: [[1500, 200]] }
  - { session: 20, at: 1.00, turns: [[1500, 200]] }
  - { session: 21, at: 1.00, turns: [[1500, 200]] }
  - { session: 22, at: 1.00, turns: [[1500, 200]] }
  - { session: 23, at: 1.00, turns: [[1500, 200]] }
  - { session: 24, at: 1.00, turns: [[1500, 200]] }
  - { session: 25, at: 1.00, turns: [[1500, 200]] }
  - { session: 26, at: 1.00, turns: [[1500, 200]] }
  - { session: 27, at: 1.00, turns: [[1500, 200]] }
  - { session: 28, at: 1.00, turns: [[1500, 200]] }
  - { session: 29, at: 1.00, turns: [[1500, 200]] }
  - { session: 30, at: 1.00, turns: [[1500, 200]] }
  - { session: 31, at: 1.00, turns: [[1500, 200]] }
  - { session: 32, at: 1.00, turns: [[1500, 200]] }
checks:
  - id: default-ttft-mean
    claim: "Mean time to first token, the site's default parameters (no fit), agrees with LLMServingSim."
    kind: calibrated
    metric: ttft_mean_s
    rel_tol: 0.3
    params: defaults
    tolerance: "30 percent: the standard the BLIS timing checks use for time to first token; queueing amplifies a step-cost error into the wait."
    known_difference:
      reference: llmservingsim
      cause: "Front-end tokenisation LLMServingSim lacks, and prefill priced at default MFU"
      reason: "At the site's default parameters the model's mean time to first token is 1936 ms against LLMServingSim's 1182 ms (+64 percent). Two things add up and this check does not separate them: the model's front end assembles and tokenises every prompt (30 ms plus 4 microseconds per token, about 36 ms for the prompts of this scenario), which LLMServingSim does not model at all; and its prefill is priced at MFU 0.5 of the catalogue's peak, where LLMServingSim sums per-layer kernel times profiled on this GPU. With parameters fitted to LLMServingSim's calibration scenarios the same metric holds (the fitted-ttft-mean check of this scenario). A first-token time this short is mostly fixed overhead, so a fixed 36 ms is a large share of it."
      differences:
        value: { typescript: 1.936, llmservingsim: 1.182 }
  - id: default-tpot-mean
    claim: "Mean time per output token, the site's default parameters (no fit), agrees with LLMServingSim."
    kind: calibrated
    metric: tpot_mean_s
    rel_tol: 0.12
    params: defaults
    tolerance: "12 percent: the standard the BLIS timing checks use for time per token (memory-bound decoding, the best-conditioned timing)."
    known_difference:
      reference: llmservingsim
      cause: "Default memory-bandwidth utilisation makes the model's decode step 60 percent slower than profiled kernels"
      reason: "At the site's default parameters (MBU 0.6) the model's decode step reads the weights at 0.6 of 1,597 GB/s and adds host time; its mean time per output token is 32.9 ms against LLMServingSim's 20.5 ms (+60 percent), whose step is the sum of per-layer kernel times profiled on this GPU. The same shape, +51 percent, is in the measured-8b-rtx-pro-6000 scenario against the real engine, so the default MBU is too low for this GPU, not an artefact of this simulator. Fitted to the calibration scenarios (MBU 0.94) the check holds."
      differences:
        value: { typescript: 0.03292, llmservingsim: 0.02053 }
  - id: default-e2e-mean
    claim: "Mean end-to-end time, the site's default parameters (no fit), agrees with LLMServingSim."
    kind: calibrated
    metric: e2e_mean_s
    rel_tol: 0.15
    params: defaults
    tolerance: "15 percent: the standard the BLIS timing checks use for end-to-end time."
    known_difference:
      reference: llmservingsim
      cause: "End-to-end time follows the slower default decode step"
      reason: "End-to-end time is the first token plus the decode of about 200 tokens: the model's 8.49 s against LLMServingSim's 5.27 s (+61 percent) is the slower decode step (and, for a short answer, the extra time to first token) at the site's default parameters, as in the time per token check of this scenario. Fitted to the calibration scenarios the check holds."
      differences:
        value: { typescript: 8.488, llmservingsim: 5.268 }
  - id: default-throughput
    claim: "Output tokens per second over the run, the site's default parameters (no fit), agrees with LLMServingSim."
    kind: calibrated
    metric: throughput_tokens_per_s
    rel_tol: 0.1
    params: defaults
    tolerance: "10 percent: the standard the BLIS timing checks use for throughput; the load is open loop, so throughput differs only through how late the last answers finish."
    known_difference:
      reference: llmservingsim
      cause: "Throughput follows the slower default decode step"
      reason: "Output tokens per second over the run: the model's 749 against LLMServingSim's 1207 (-38 percent). The burst is thirty-two simultaneous requests that drain at the decode rate of a batch of 32, which the model's default parameters make 60 percent slower than the profiled kernels (the time per token check of this scenario), so the whole batch takes proportionally longer. Fitted, it holds."
      differences:
        value: { typescript: 749.3, llmservingsim: 1207 }
  - id: fitted-ttft-mean
    claim: "Mean time to first token, parameters fitted to the calibration scenarios calib-lss-8b-rtx-pro-6000-*, agrees with LLMServingSim."
    kind: calibrated
    metric: ttft_mean_s
    rel_tol: 0.3
    params: fitted
    tolerance: "30 percent: the standard the BLIS timing checks use for time to first token; queueing amplifies a step-cost error into the wait."
  - id: fitted-tpot-mean
    claim: "Mean time per output token, parameters fitted to the calibration scenarios calib-lss-8b-rtx-pro-6000-*, agrees with LLMServingSim."
    kind: calibrated
    metric: tpot_mean_s
    rel_tol: 0.12
    params: fitted
    tolerance: "12 percent: the standard the BLIS timing checks use for time per token (memory-bound decoding, the best-conditioned timing)."
  - id: fitted-e2e-mean
    claim: "Mean end-to-end time, parameters fitted to the calibration scenarios calib-lss-8b-rtx-pro-6000-*, agrees with LLMServingSim."
    kind: calibrated
    metric: e2e_mean_s
    rel_tol: 0.15
    params: fitted
    tolerance: "15 percent: the standard the BLIS timing checks use for end-to-end time."
  - id: fitted-throughput
    claim: "Output tokens per second over the run, parameters fitted to the calibration scenarios calib-lss-8b-rtx-pro-6000-*, agrees with LLMServingSim."
    kind: calibrated
    metric: throughput_tokens_per_s
    rel_tol: 0.1
    params: fitted
    tolerance: "10 percent: the standard the BLIS timing checks use for throughput; the load is open loop, so throughput differs only through how late the last answers finish."
