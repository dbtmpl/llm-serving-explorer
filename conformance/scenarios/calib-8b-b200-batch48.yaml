id: calib-8b-b200-batch48
title: Calibration data, forty-eight sequences decoding together, Llama 3.1 8B on one B200
role: calibration
# Forty-eight requests 80 ms apart: the batch grows to 48 and decodes together, short context (KV reads and per-sequence host time matter more than at small batch).
model: llama-3.1-8b
gpu: b200
engine:
  tp: 1
  gpu_memory_utilisation: 0.9
  max_num_seqs: 64
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
replicas: 1
routing: round-robin
