id: preemption-overflow
title: Preemption when two growing sequences outgrow the KV pool
# The KV pool is made small (30% memory utilisation, about 55,000 tokens in both simulators) and two
# requests each need 32,000 tokens by the time they finish: 16,000 of prompt and 16,000 generated.
# Either fits alone (58% of the pool); together they cannot, so when their joint context reaches the
# pool the engine must free one of them. vLLM frees the most recently admitted sequence (B) and
# recomputes it later. The sizes are chosen against the pool, not tuned to a result: the two pools
# agree to a few blocks (see kv-budget-8b-h100), and both are far from either extreme.
model: llama-3.1-8b
gpu: h100
engine:
  tp: 1
  gpu_memory_utilisation: 0.3
  max_num_seqs: 12
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
  max_model_len: 40000   # BLIS refuses a pool that cannot hold one sequence of this length; each request here needs 32,000
replicas: 1
routing: prefix-aware
requests:
  - { session: 1, at: 1.0, turns: [[16000, 16000]] }
  - { session: 2, at: 1.5, turns: [[16000, 16000]] }
checks:
  - id: preemption-count
    claim: Exactly one preemption happens, and both requests finish.
    kind: exact
    quantity: preemptions
    tolerance: A count of discrete engine events in a case built to produce exactly one.
  - id: both-complete
    claim: Both requests complete.
    kind: exact
    quantity: request_fate
    tolerance: Fate is discrete.
