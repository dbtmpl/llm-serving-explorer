id: prefix-cache
title: Prefix cache on follow-up turns, one replica
# Three conversations on one pod. Lengths are deliberately not multiples of 16, so that the
# whole-block rule shows: reuse is floor(history / 16) * 16, and the last token is always computed.
# Rounds are 20 s apart, far longer than any answer, so every follow-up finds its history finished
# and nothing else is competing for the cache.
model: llama-3.1-8b
gpu: h100
engine:
  tp: 1
  gpu_memory_utilisation: 0.9
  max_num_seqs: 12
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
replicas: 1
routing: prefix-aware
requests:
  - { session: 1, at: 1.0, gap_s: 20, turns: [[1000, 50], [100, 40], [100, 40], [213, 30]] }
  - { session: 2, at: 2.0, gap_s: 20, turns: [[777, 33], [37, 33], [16, 33], [1, 33]] }
  - { session: 3, at: 3.0, gap_s: 20, turns: [[2500, 200], [300, 100], [5, 60]] }
checks:
  - id: cached-prefix-tokens
    claim: Each follow-up is served from the prefix cache up to the last whole block of its history; first turns are served from nothing.
    kind: exact
    quantity: prefix_cached_tokens
    tolerance: Block arithmetic on integers (floor(history / 16) * 16); both simulators implement vLLM's block-hash rule, so there is no tolerance to give.
