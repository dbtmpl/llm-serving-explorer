id: routing-prefix-aware
title: Prefix-aware routing returns follow-ups to the replica that holds the session
# Four conversations start 0.3 s apart with answers of about three seconds, so each finds a
# different replica less loaded than the ones before it and the four spread over the four replicas.
# Their follow-ups come 20 s and 40 s later, when every replica is idle and equally loaded: the only
# difference between replicas is which one holds the conversation, and a prefix-aware router must
# use it. Replicas are named by first use.
model: llama-3.1-8b
gpu: h100
engine:
  tp: 1
  gpu_memory_utilisation: 0.9
  max_num_seqs: 12
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
replicas: 4
routing: prefix-aware
requests:
  - { session: 1, at: 1.0, gap_s: 20, turns: [[2000, 300], [150, 30], [150, 30]] }
  - { session: 2, at: 1.3, gap_s: 20, turns: [[2000, 300], [150, 30], [150, 30]] }
  - { session: 3, at: 1.6, gap_s: 20, turns: [[2000, 300], [150, 30], [150, 30]] }
  - { session: 4, at: 1.9, gap_s: 20, turns: [[2000, 300], [150, 30], [150, 30]] }
checks:
  - id: session-stays-on-its-replica
    claim: No conversation ever changes replica.
    kind: exact
    quantity: session_pod_changes
    tolerance: Counts of discrete decisions.
  - id: pod-choice
    claim: The four conversations occupy four different replicas, and every follow-up goes back to its own.
    kind: exact
    quantity: routed_pod
    tolerance: A routing decision is a discrete choice.
  - id: cached-prefix-tokens
    claim: Because follow-ups return home, each is served from the prefix cache up to its last whole block.
    kind: exact
    quantity: prefix_cached_tokens
    tolerance: Block arithmetic on integers.
    known_difference:
      reason: >-
        Round 2 of every conversation has a history of 2,480 tokens (2000 + 300 + 150 + 30), a multiple of 16. Both
        simulators route it to the replica that holds the conversation (see pod-choice, which agrees). vLLM, and so BLIS,
        never writes the KV of the last token a request samples, so the cache holds 2,479 tokens of that history and
        reuses 2,464 (the last whole block, 2,464-2,479, is incomplete). The TypeScript model counts the last output token
        as cached and reuses 2,480. Same cause as the one difference in the prefix-cache scenario.
      differences:
        s1/r2: { typescript: 2480, blis: 2464 }
        s2/r2: { typescript: 2480, blis: 2464 }
        s3/r2: { typescript: 2480, blis: 2464 }
        s4/r2: { typescript: 2480, blis: 2464 }
