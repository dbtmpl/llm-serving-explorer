id: timing-8b-h100-heavy
title: Held-out timing, Llama 3.1 8B on one H100, many sequences at once
# Held out from the calibration set: 120 requests 0.1 s apart with prompts of 800 to 2,500 tokens and answers of 200 to 500, so about 30 sequences decode together and new prompts keep arriving.
