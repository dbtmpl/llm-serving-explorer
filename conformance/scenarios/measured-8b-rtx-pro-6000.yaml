id: measured-8b-rtx-pro-6000
title: "Measured vLLM 0.31.0: Llama 3.1 8B on one RTX PRO 6000 Blackwell Server Edition, 300 ShareGPT requests at about 10 per second"
# Replays the 300 measured requests of a real vLLM run (reference "vllm-measured": conformance/refs/vllm-measured/, measurements published with
# LLMServingSim, MIT licence) through the TypeScript model: the same arrivals (client send times, microseconds), prompt and output token counts,
# and the engine's own settings from the run's meta.json. The reference refuses a scenario whose requests or settings differ from the run.
#
# What the run was: vLLM 0.31.0, one RTX PRO 6000 Blackwell Server Edition (the driver reported 101,976,440,832 bytes), gpu_memory_utilization 0.92, max_num_seqs 128, max_num_batched_tokens 2048, chunked prefill, prefix caching on; the engine reported 36,649 KV blocks. 300 ShareGPT prompts at about 10 requests per second (29 s of arrivals); the engine saturates its 128 sequences and a queue builds.
# Not represented: prompt token ids (the model has no token content, so it sees no prefix reuse between requests; the real engine served 19,552
# of the 257,239 prompt tokens from its prefix cache), asynchronous scheduling, CUDA graphs, the API server's tokeniser pool, and max_model_len (the
# model has no limit).
#
# Two readings of timing, kept apart:
#   default-*  the site's DEFAULT efficiency parameters, no fit, over all 300 requests: how far the model is from real hardware out of the box.
#   fitted-*   MBU, MFU and the two host-time terms fitted (conformance:calibrate) to the first 100 requests by arrival (the calibration subset),
#              then checked on the other 200 (held out). The fit sees the measured time to first token of each calibration request and their
#              mean time per token, nothing else, and nothing is fitted to the held-out requests.
# The tolerances are the ones the BLIS timing checks use for the same metrics, written here before the first comparison; they are not tuned.
model: llama-3.1-8b
gpu: rtx-pro-6000
engine:
  tp: 1
  gpu_memory_utilisation: 0.92
  max_num_seqs: 128
  max_num_batched_tokens: 2048
  block_size: 16
  prefix_caching: true
references: [vllm-measured, llmservingsim]
replicas: 1
routing: prefix-aware
fit_reference: vllm-measured
split: { calibration_requests: 100 }
