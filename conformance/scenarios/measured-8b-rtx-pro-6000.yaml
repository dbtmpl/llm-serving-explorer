  - id: default-tpot-mean
    claim: Mean time per output token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: tpot_mean_s
    rel_tol: 0.12
    params: defaults
    subset: all
    tolerance: "12 percent: the standard the BLIS timing checks use for time per token (memory-bound decoding, the best-conditioned timing)."
    known_difference:
      - reference: vllm-measured
        cause: "The model's decode step is slower than the real engine's at default parameters, and the fit goes to a bound"
        reason: &r_decode >-
          Default parameters: MBU 0.6, MFU 0.5, host time 1.5 ms plus 0.05 ms per sequence. The model's mean time per output token is 47.5 ms against 31.4 ms
          measured (+51 percent), and the same shape holds at the median and the 99th percentile. The weight read alone is 16.06 GB over 0.6 x 1,597 GB/s = 16.8
          ms; the host term adds up to 7.9 ms at 128 sequences; the rest is the KV read of the batch. The real step is 31 ms. When the parameters are fitted to
          the first 100 requests the fit sets MBU to its upper bound, 1.0, and MFU to 0.8: a physically impossible bandwidth fraction, which says the structure
          of the decode cost (not the achieved-bandwidth factor) is what is off; which part (attention reads, host time, graph replay) was not isolated here.
          The 500 TFLOP/s peak in the catalogue for this GPU is also probably twice its BF16 rate with FP32 accumulate, so the fitted MFU of 0.8 would mean 400
          TFLOP/s; the data (decode-dominated) barely constrain it.
        differences:
          value: { typescript: 0.04748, vllm-measured: 0.03144 }
      - reference: llmservingsim
        cause: "The model's decode step is slower than the real engine's at default parameters, and the fit goes to a bound"
        reason: "LLMServingSim gives 0.03151 where the model gives 0.04748 (+50.7 percent). The measured value is 0.03144, so LLMServingSim and the real engine agree with each other here and the cause is the one recorded for vllm-measured. LLMServingSim's step times are per-layer kernel tables profiled on this GPU and its authors validated it against these very runs, so close agreement between it and the measurement is what they report, not independent evidence about the model. Cause, as recorded for vllm-measured: The model's decode step is slower than the real engine's at default parameters, and the fit goes to a bound"
        differences:
