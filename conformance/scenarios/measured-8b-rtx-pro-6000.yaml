checks:
  - id: kv-blocks-per-replica
    claim: One replica holds the same number of KV blocks as the real engine reported, to within 0.1 percent.
    kind: capacity
    quantity: kv_blocks_per_replica
    rel_tol: 0.001
    params: defaults
    tolerance: "0.1 percent: the capacity rule of 2026-11-16 (docs/parity.md), applied unchanged to a real engine. The terms that remain are estimates on both sides and a difference below one part in a thousand changes no admission decision; a larger one is explained term by term in the known difference."
    reference_gap:
      reason: >-
        The real engine reported 36,649 KV blocks; LLMServingSim derives 37,090 from the same memory utilisation (0.92 of the 94.97 GiB its hardware file states, less the 16.06 GB of weights, over 2,097,152 bytes per block), 441 blocks or 1.2 percent more. It sets nothing aside for the activation peak, CUDA graphs or the context (its own documentation: "an upper bound on vLLM's at the same value"), which is the 0.900 GB that the span record below finds the real engine set aside. So the two references differ by exactly the terms the simulator leaves out; its figure is arithmetic on its input, not a second measurement of how vLLM sizes its pool.
      differences:
        value: { vllm-measured: 36649, llmservingsim: 37090 }
    known_difference:
      reference: span
      cause: "The activation and graph terms of the model's memory budget are not the real engine's"
      reason: &r_kv >-
        Term by term, per the model's budget (src/sim/cost/memory.ts). Requested memory is ceil(101,976,440,832 x 0.92) = 93,818,325,566 bytes on both sides.
        Weights are 16.06e9 bytes on both (the checkpoint has 8,030,261,248 parameters, 16,060,522,496 bytes). That leaves, for the real engine, 93.818 -
        16.061 - 76.859 (its 36,649 blocks of 2,097,152 bytes) = 0.900 GB for activations, CUDA graphs and everything else it set aside; the model sets aside
        1.895 GB (735,313,920 bytes of activations, 1,159,725,056 bytes of graphs) and gets 36,174 blocks, 475 fewer (996 MB). The model's activation peak is
        that of an 8,192-token step, whatever max_num_batched_tokens is, and this engine profiled a 2,048-token step: scaled by 2,048/8,192 the term is 183.8
        MB, which accounts for 263 of the 475 blocks. The remaining 212 blocks (445 MB) are the model's graph term (the median of H100 start-up logs of
        another vLLM version) against what the run implies for graphs and other overhead (716 MB); that part is inferred as a remainder, not measured.
        Measured: 0.900 GB. Not tuned: the model's budget is left as it is.
      differences:
        value: { typescript: 36174, span: "[36649, 37090]" }
  - id: preemptions
    claim: The real engine preempted nothing in this run, and neither does the model.
    kind: exact
    quantity: preemptions
    params: defaults
    tolerance: A count of discrete engine events; the KV pool is far larger than the load needs, so none is expected on either side.
  - id: prefix-hit-rate
    claim: The share of prompt tokens served from the prefix cache agrees with the real engine's.
    kind: calibrated
    metric: prefix_hit_rate
    rel_tol: 0.05
    params: defaults
    subset: all
    tolerance: "5 percent relative: both sides count whole 16-token blocks of the same 257,239 prompt tokens, so two engines that find the same sharing differ by a handful of blocks (5 percent is about 970 tokens); a model that sees no sharing at all is 100 percent off."
    known_difference:
      - reference: vllm-measured
        cause: "The model has no token content, so it sees no prefix sharing"
        reason: &r_prefix >-
          The model's workload has token counts, not token ids, so no two requests share a prefix in it and its prefix cache serves nothing: 0 of 257,239 prompt tokens. The real engine served 19,552
          (7.60 percent) from its prefix cache, ShareGPT prompts sharing system prompts and conversation openings. The effect on timing is bounded by the share: 7.6 percent of the prompt tokens is about 4 percent of the
          tokens the engine computes (prompts are 57 percent of them), and the model computes all of them. Not isolated: how much of the real engine's queueing this saves.
        differences:
          value: { typescript: 0, vllm-measured: 0.07601 }
      - reference: llmservingsim
        cause: "The model has no token content, so it sees no prefix sharing"
        reason: >-
          LLMServingSim is given token ids with the sharing structure of the real prompts (rebuilt from the longest shared prefix of each request with an earlier one, conformance/refs/llmservingsim/data) and serves
          19,520 of the 257,239 prompt tokens (7.59 percent) from its prefix cache, 32 tokens (two blocks) fewer than the real engine; the model sees no sharing at all (see the vllm-measured record).
        differences:
          value: { typescript: 0, llmservingsim: 0.07588 }
  - id: default-ttft-mean
    claim: Mean time to first token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: ttft_mean_s
    rel_tol: 0.3
    params: defaults
    subset: all
    tolerance: "30 percent: the standard the BLIS timing checks use for time to first token. Under queueing a small step-cost error is amplified into a larger wait, so this is the loosest of the timing standards."
    known_difference:
      - reference: vllm-measured
        cause: "Queue wait compounds the slower service rate: the engine is saturated after the first 100 requests"
        reason: &r_queue >-
          The load is 195,753 output tokens requested in 29 s (about 6,750 per second) against a measured service rate of 3,068 tokens per second, so after the
          first 100 requests (mean time to first token 0.14 s) a queue builds and each request waits for the shortfall accumulated before it. The model at
          default parameters serves 2,067 tokens per second (-33 percent), so its queue grows about twice as fast: mean time to first token 14.6 s against 6.5
          s, median 19.7 against 8.4, 99th percentile 39.7 against 18.4. Even before the queue the model is slower (first 100 requests, mean 0.28 s against 0.14
          s), because its steps, which carry decodes beside each prefill chunk, are slower by the same factor as its decode. The error is the decode-cost error
          amplified by queueing; it is not an independent prefill error. Not isolated: how much of
          the real engine's 7.6 percent prefix-cache hits (19,552 of 257,239 prompt tokens, which the model cannot represent) shortens its prefill.
        differences:
          value: { typescript: 14.58, vllm-measured: 6.515 }
      - reference: llmservingsim
        cause: "Queue wait compounds the slower service rate: the engine is saturated after the first 100 requests"
        reason: "LLMServingSim gives 6.556 where the model gives 14.58 (+122.4 percent). The measured value is 6.515, so LLMServingSim and the real engine agree with each other here and the cause is the one recorded for vllm-measured. LLMServingSim's step times are per-layer kernel tables profiled on this GPU and its authors validated it against these very runs, so close agreement between it and the measurement is what they report, not independent evidence about the model. Cause, as recorded for vllm-measured: Queue wait compounds the slower service rate: the engine is saturated after the first 100 requests"
        differences:
          value: { typescript: 14.58, llmservingsim: 6.556 }
