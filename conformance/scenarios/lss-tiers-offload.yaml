id: lss-tiers-offload
title: Host-memory tier on or off, follow-ups to conversations the GPU has already evicted, RTX PRO 6000
references: [llmservingsim]
# The construction of tiers-offload on the RTX PRO 6000. Memory utilisation 0.25 gives the TypeScript model a pool of about 57,500 tokens and LLMServingSim about 72,000 (it sets nothing aside for activations);
# 30 conversations of 3,050 tokens (91,500) start one second apart and each is followed up 60 s later in the same order, so under least-recently-used eviction every follow-up finds its conversation
# evicted from the GPU in both. With a 32 GB host tier per replica every conversation is kept, and a follow-up reloads its history instead of recomputing it. LLMServingSim moves 256-token chunks
# and the TypeScript model whole conversations, so hit rates and times are compared as effects, not block traces.
model: llama-3.1-8b
gpu: rtx-pro-6000
engine:
  tp: 1
  gpu_memory_utilisation: 0.25
  max_num_seqs: 64
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
  async_scheduling: true
replicas: 1
routing: round-robin
arms:
  gpu-only: {}
  with-dram: { offload: { cpu_gb: 32 } }
requests:
  - { session: 1, at: 1.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 2, at: 2.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 3, at: 3.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
