checks:
  - id: host-tier-hit-rate
    claim: With the tier, a share of prompt tokens is served from host memory; without it, none is.
    kind: directional
    metric: cpu_tier_hit_rate
    baseline: gpu-only
    intervention: with-dram
    effect: difference
    direction: increase
    band: [0.67, 1.5]
    tolerance: "The two simulators' host-tier hit rates must be within a factor of 1.5 of each other: the rate is set by which conversations were evicted and fit in 32 GB, which both decide by least-recently-used order, but one keeps 256-token chunks and the other whole conversations, so a few percent of tokens can differ."
  - id: follow-up-time-to-first-token
    claim: A follow-up's time to first token falls when its history is reloaded from host memory instead of recomputed.
    kind: directional
    metric: followup_ttft_mean_s
    baseline: gpu-only
    intervention: with-dram
    effect: ratio
    direction: decrease
    band: [0.75, 1.33]
    tolerance: "The two simulators' ratios (with tier over without) must be within a factor of 1.33 of each other: the saving is the recompute of about 3,000 tokens less a copy at the tier's rate, and both fixed overheads are untouched, so a quarter either way allows for the different copy rates."
    known_difference:
      reference: llmservingsim
      cause: "The model's fixed front-end tokenisation and slower host copy dominate a short reload"
      reason: >-
        With the tier a follow-up's first token takes 0.0824 s in the model and 0.0221 s in LLMServingSim; without it 0.175 s and 0.134 s, so the effects are x0.471 and x0.164. Isolated by re-running the model: its host copy runs at
        20 GB/s (a default) where LLMServingSim's example configuration says 256 GB/s, and a copy of the 3,050-token history (400 MB) is 20 ms against 1.6 ms; at 256 GB/s the model's tier arm is 0.0624 s (x0.357). The remaining 40 ms is the
        model's front end, which assembles and tokenises every prompt (30 ms plus 4 microseconds per token, 42 ms for 3,050 tokens) and LLMServingSim does not model: 0.0624 - 0.042 is 0.020 s, which is LLMServingSim's 0.022 s. So
        the reload behaves alike (the hit rates agree); the ratio differs because the quantity is a short time dominated by fixed terms on one side only.
      differences:
        effect: { typescript: 0.4709, llmservingsim: 0.1644 }
