id: calib-lss-8b-rtx-pro-6000-batch4
title: Calibration data, four sequences decoding together, Llama 3.1 8B on one RTX PRO 6000
role: calibration
references: [llmservingsim]
# Four requests 80 ms apart (BLIS queues requests through a tokeniser pool, so simultaneous arrivals reach its engine one after another and the TypeScript model's front end has no such queue): the batch grows to 4 and then decodes together.
model: llama-3.1-8b
gpu: rtx-pro-6000
engine:
  tp: 1
  gpu_memory_utilisation: 0.92
  max_num_seqs: 64
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
replicas: 1
routing: round-robin
requests:
  - { session: 1, at: 1.00, turns: [[1000, 300]] }
  - { session: 2, at: 1.08, turns: [[1000, 300]] }
  - { session: 3, at: 1.16, turns: [[1000, 300]] }
  - { session: 4, at: 1.24, turns: [[1000, 300]] }
checks: []
