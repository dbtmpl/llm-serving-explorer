checks:
  - id: kv-blocks-per-replica
    claim: One replica holds the same number of KV blocks as the real engine reported, to within 0.1 percent.
    kind: capacity
    quantity: kv_blocks_per_replica
    references: [vllm-measured]
    rel_tol: 0.001
    params: defaults
    tolerance: "0.1 percent: the capacity rule of 2026-11-16 (docs/parity.md), applied unchanged to a real engine. The terms that remain are estimates on both sides and a difference below one part in a thousand changes no admission decision; a larger one is explained term by term in the known difference."
    known_difference:
      reference: vllm-measured
      cause: "The model's pool is larger: the engine's profile counted memory the model has no term for"
      reason: &r_kv >-
        Term by term, per the model's budget (src/sim/cost/memory.ts). Requested memory is ceil(25,250,627,584 x 0.9) = 22,725,564,826 bytes on both sides, and the weights are
        16.06e9 bytes on both. The real engine set aside 22.726 - 16.061 - 5.427 (its 2,588 blocks of 2,097,152 bytes) = 1.238 GB for everything else; the model sets aside 0.471 GB
        and gets 2,953 blocks, 365 more (765 MB, +14.1 percent). The model's 0.471 GB is derived from the run's own settings: the start-up profiling pass is a forward pass over
        max_num_batched_tokens = 2,048 tokens (151.0 MB) followed by the sampler over min(2,048, 256) rows of the 128,256-token vocabulary (2,048 x 4,096 x 2 + 256 x 128,256 x 10
        = 345.1 MB, the larger of the two), plus 125.8 MB for the 51 + 35 CUDA graphs of the capture list. The run was vLLM 0.19.0, which does not subtract a graph estimate from the
        pool (VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS is off until v0.21), so the graph term has no counterpart here (60 blocks); the other 305 blocks (0.64 GB) are what the engine's
        profile counted and the model has no term for: memory the process holds outside torch's allocator (vllm/utils/mem_utils.py counts the growth of non-torch memory) and the
        allocator's own rounding, neither of which the run records. On the RTX PRO 6000 the same unexplained part is 0.65 GB, so it looks like a property of the engine and not of the card,
        but the two cards ran different vLLM versions and one run is not enough to derive it. Not tuned: the model's budget is left as the sources give it. The pool is small here (weights take
        71 percent of the requested memory), so an error that is 0.8 percent on the 96 GB card is 14 percent here.
      differences:
        value: { typescript: 2953, vllm-measured: 2588 }
  - id: prefix-hit-rate
    claim: The share of prompt tokens served from the prefix cache agrees with the real engine's.
    kind: calibrated
    metric: prefix_hit_rate
    rel_tol: 0.05
    params: defaults
    subset: all
    references: [llmservingsim]
    tolerance: "5 percent relative: both sides count whole 16-token blocks of the same 257,239 prompt tokens, so two engines that find the same sharing differ by a handful of blocks (5 percent is about 970 tokens); a model that sees no sharing at all is 100 percent off."
  - id: preemptions
    claim: LLMServingSim and the model preempt the same number of times in this run (the real engine did not record its preemptions).
    kind: exact
    quantity: preemptions
    references: [llmservingsim]
    params: defaults
    tolerance: A count of discrete engine events; equal.
  - id: default-ttft-mean
    claim: Mean time to first token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: ttft_mean_s
    rel_tol: 0.3
    params: defaults
    subset: all
    tolerance: "30 percent: the standard the BLIS timing checks use for time to first token. Under queueing a small step-cost error is amplified into a larger wait, so this is the loosest of the timing standards."
  - id: default-ttft-p50
    claim: Median time to first token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: ttft_p50_s
    rel_tol: 0.3
    params: defaults
    subset: all
    tolerance: "30 percent: the same standard as the mean."
  - id: default-ttft-p99
    claim: 99th-percentile time to first token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: ttft_p99_s
    rel_tol: 0.3
    params: defaults
    subset: all
    tolerance: "30 percent: the same standard as the mean; the tail is set by the longest queue, which a step-cost error compounds."
  - id: default-tpot-mean
    claim: Mean time per output token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: tpot_mean_s
    rel_tol: 0.12
    params: defaults
    subset: all
    tolerance: "12 percent: the standard the BLIS timing checks use for time per token (memory-bound decoding, the best-conditioned timing)."
    known_difference:
      reference: vllm-measured
      cause: "Time per token: the model recomputes preempted requests from zero where the engine reuses its prefix cache"
      reason: &r_tpot >-
        The decode step itself agrees. The run's per-second statistics give 24.4 to 25.9 ms per step in its saturated stretches (33 to 37 running sequences, 98 percent of the KV pool,
        about 21.5 GB read per step, 0.83 to 0.88 of the datasheet bandwidth), and the model's step for such a batch is 26.1 ms (21.5 GB at MBU 0.85, plus 1.0 ms to launch 32 layers). The
        excess is elsewhere. The model preempts 183 times and recomputes 168,669 tokens, 66 percent of the prompt tokens; a vLLM block that is freed stays in the prefix cache until another
        sequence reuses it, so a preempted request re-enters at whatever is still cached, where the model's recompute starts from zero (the run recorded neither preemptions nor cache hits, so the
        real count is not known). The model's pool is also 14 percent larger than the engine's (kv-blocks-per-replica), which lets more sequences share each step; with the pool set to the engine's
        2,588 blocks (a run made for this note, not a check) the model's mean time per token is +16 percent and its 99th percentile +15 percent, with 186 preemptions and 193,313 recomputed tokens.
        So about 16 of the 22 points are the recompute, and that, not the cost of a step, is the largest known error of this scenario. Not tuned.
      differences:
        value: { typescript: 0.0395, vllm-measured: 0.03245 }
  - id: default-tpot-p50
    claim: Median time per output token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: tpot_p50_s
    rel_tol: 0.12
    params: defaults
    subset: all
    tolerance: "12 percent: the same standard as the mean."
    known_difference:
      reference: vllm-measured
      cause: "Time per token: the model recomputes preempted requests from zero where the engine reuses its prefix cache"
      reason: *r_tpot
      differences:
        value: { typescript: 0.03769, vllm-measured: 0.03076 }
