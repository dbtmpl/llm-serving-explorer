  - id: fitted-tpot-p99
    claim: 99th-percentile time per output token over the 200 held-out requests, parameters fitted to the first 100 agrees with the measured run.
    kind: calibrated
    metric: tpot_p99_s
    rel_tol: 0.2
    params: fitted
    subset: held-out
    tolerance: "20 percent: the tail of time per token is set by the few steps that carry a long prefill chunk or a large batch, which a mean-fitted model reproduces less closely than the mean."
    known_difference:
      reference: vllm-measured
      cause: "The real run has a heavier tail of per-token time than the model reproduces; not explained"
      reason: &r_p99 >-
        On the 200 held-out requests with the fitted parameters the model's 99th-percentile time per output token is 37.5 ms against 55.0 ms measured (-31.9
        percent), while its median (28.2 against 30.8 ms) and mean (28.2 against 31.7 ms, -10.9 percent) are inside tolerance. The measured tail is 1.8 times
        its median, the model's 1.3 times. Candidates, none tested here: stalls from preemption and recompute in the real engine (the run did not record
        preemptions, so this cannot be checked; the model's own pool is smaller and it preempts 188 times); step-time variance of the real card (clocks, host
        jitter) that a deterministic model does not have; prefix-cache hits (not representable). Recorded as a miss, not tuned.
      differences:
        value: { typescript: 0.03747, vllm-measured: 0.05501 }
