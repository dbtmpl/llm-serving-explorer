checks:
  - id: kv-blocks-per-replica
    claim: One replica holds the same number of KV blocks as the real engine reported, to within 0.1 percent.
    kind: capacity
    quantity: kv_blocks_per_replica
    rel_tol: 0.001
    params: defaults
    tolerance: "0.1 percent: the capacity rule of 2026-11-16 (docs/parity.md), applied unchanged to a real engine. The terms that remain are estimates on both sides and a difference below one part in a thousand changes no admission decision; a larger one is explained term by term in the known difference."
    known_difference:
      reference: vllm-measured
      cause: "The activation and graph terms of the model's memory budget are not the real engine's"
      reason: &r_kv >-
        Term by term, per the model's budget (src/sim/cost/memory.ts). Requested memory is ceil(25,250,627,584 x 0.9) = 22,725,564,826 bytes on both sides.
        Weights are 16.06e9 bytes on both. The real engine set aside 22.726 - 16.061 - 5.427 (its 2,588 blocks of 2,097,152 bytes) = 1.238 GB for activations,
        graphs and everything else; the model sets aside 1.895 GB (735,313,920 bytes of activations at an 8,192-token step, 1,159,725,056 bytes of graphs) and
        gets 2,274 blocks, 314 fewer (658 MB, 12.1 percent). The engine profiled a 2,048-token step; scaling the model's activation term by 2,048/8,192 gives
        183.8 MB and accounts for 263 blocks. The remaining 51 blocks (106 MB) are the model's graph term (the median of H100 start-up logs of another vLLM
        version) against the 1.054 GB the run implies for graphs and other overhead, a remainder not a measurement. The pool is small here (weights take 71
        percent of the requested memory), so the same fixed errors weigh 12 percent where they weigh 1.3 percent on the 96 GB card. Not tuned: the model's
        budget is left as it is.
      differences:
        value: { typescript: 2274, vllm-measured: 2588 }
  - id: default-ttft-mean
    claim: Mean time to first token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: ttft_mean_s
    rel_tol: 0.3
    params: defaults
    subset: all
    tolerance: "30 percent: the standard the BLIS timing checks use for time to first token. Under queueing a small step-cost error is amplified into a larger wait, so this is the loosest of the timing standards."
    known_difference:
      reference: vllm-measured
      cause: "Queue wait compounds the slower service rate: the engine is saturated from the first requests"
      reason: &r_queue >-
        The load (195,753 output tokens in 29 s, about 6,750 per second) is far above this card's measured service rate of 1,066 tokens per second, so a queue
        builds from the start and the wait of the k-th request is the shortfall accumulated before it (mean time to first token for the first 100 requests is
        already 17.9 s, then 64.7 s, then 113.9 s). The model at default parameters serves 590 tokens per second (-45 percent), so its queue grows 1.8 times
        as fast: mean time to first token 135 s against 65.5 s, median 130 against 60, 99th percentile 274 against 137. The error is the decode-cost error
        amplified by queueing.
      differences:
        value: { typescript: 135.1, vllm-measured: 65.49 }
  - id: default-ttft-p50
    claim: Median time to first token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: ttft_p50_s
    rel_tol: 0.3
    params: defaults
    subset: all
    tolerance: "30 percent: the same standard as the mean."
    known_difference:
      reference: vllm-measured
      cause: "Queue wait compounds the slower service rate: the engine is saturated from the first requests"
      reason: *r_queue
      differences:
        value: { typescript: 130.2, vllm-measured: 60.13 }
  - id: default-ttft-p99
    claim: 99th-percentile time to first token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: ttft_p99_s
    rel_tol: 0.3
    params: defaults
    subset: all
    tolerance: "30 percent: the same standard as the mean; the tail is set by the longest queue, which a step-cost error compounds."
    known_difference:
      reference: vllm-measured
      cause: "Queue wait compounds the slower service rate: the engine is saturated from the first requests"
      reason: *r_queue
      differences:
        value: { typescript: 274.1, vllm-measured: 137.4 }
  - id: default-tpot-mean
    claim: Mean time per output token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: tpot_mean_s
    rel_tol: 0.12
    params: defaults
    subset: all
    tolerance: "12 percent: the standard the BLIS timing checks use for time per token (memory-bound decoding, the best-conditioned timing)."
    known_difference:
      reference: vllm-measured
      cause: "The model's decode step is slower than the real engine's at default parameters, and the fit goes to a bound"
      reason: &r_decode >-
        Default parameters: MBU 0.6, MFU 0.5, host time 1.5 ms plus 0.05 ms per sequence. The model's mean time per output token is 51.4 ms against 32.4 ms
        measured (+58 percent). The weight read alone is 16.06 GB over 0.6 x 1,008 GB/s = 26.6 ms. At the largest batch the run reached (49 sequences of about
        1,190 tokens of context, 7.6 GB of KV) the real step moves 23.7 GB in 32.4 ms, 731 GB/s, which is 73 percent of the datasheet bandwidth with no
        allowance for host time, so no MBU below about 0.73 can reproduce it. The fit to the first 100 requests puts MBU at its upper bound, 1.0, host time at
        its lower bound, and MFU at 0.8: parameters at their limits say that the structure of the decode cost, not a factor, is off; which part was not
        isolated here. This card's pool also differs from the engine's (2,274 blocks against 2,588), and the model preempts 184 times at default parameters,
        188 fitted; the run recorded no preemption count, so the effect of that on the real engine's decode is not known.
      differences:
        value: { typescript: 0.05136, vllm-measured: 0.03245 }
  - id: default-tpot-p50
    claim: Median time per output token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: tpot_p50_s
    rel_tol: 0.12
    params: defaults
    subset: all
    tolerance: "12 percent: the same standard as the mean."
    known_difference:
      reference: vllm-measured
      cause: "The model's decode step is slower than the real engine's at default parameters, and the fit goes to a bound"
      reason: *r_decode
      differences:
        value: { typescript: 0.04924, vllm-measured: 0.03076 }
  - id: default-tpot-p99
    claim: 99th-percentile time per output token over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: tpot_p99_s
    rel_tol: 0.2
    params: defaults
    subset: all
    tolerance: "20 percent: the tail of time per token is set by the few steps that carry a long prefill chunk or a large batch, which a mean-fitted model reproduces less closely than the mean."
    known_difference:
      reference: vllm-measured
      cause: "The model's decode step is slower than the real engine's at default parameters, and the fit goes to a bound"
      reason: *r_decode
      differences:
        value: { typescript: 0.08653, vllm-measured: 0.056 }
  - id: default-e2e-mean
    claim: Mean end-to-end time over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: e2e_mean_s
    rel_tol: 0.15
    params: defaults
    subset: all
    tolerance: "15 percent: the standard the BLIS timing checks use for end-to-end time."
    known_difference:
      reference: vllm-measured
      cause: "End-to-end time is the queue wait plus a decode that is over half again too slow"
      reason: &r_e2e >-
        End-to-end time is time to first token plus the decode of about 650 tokens: at default parameters the model's mean is 168.6 s against 86.6 s measured
        (+95 percent), median +94 percent, 99th percentile +96 percent. About 70 s of it is the queue (135 against 65.5 s) and the rest the slower decode
        (51.4 against 32.4 ms over about 650 tokens).
      differences:
        value: { typescript: 168.6, vllm-measured: 86.61 }
  - id: default-e2e-p50
    claim: Median end-to-end time over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: e2e_p50_s
    rel_tol: 0.15
    params: defaults
    subset: all
    tolerance: "15 percent: the same standard as the mean."
    known_difference:
      reference: vllm-measured
      cause: "End-to-end time is the queue wait plus a decode that is over half again too slow"
      reason: *r_e2e
      differences:
        value: { typescript: 161.6, vllm-measured: 83.42 }
  - id: default-e2e-p99
    claim: 99th-percentile end-to-end time over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: e2e_p99_s
    rel_tol: 0.2
    params: defaults
    subset: all
    tolerance: "20 percent: the tail adds the longest queue to the longest answer."
    known_difference:
      reference: vllm-measured
      cause: "End-to-end time is the queue wait plus a decode that is over half again too slow"
      reason: *r_e2e
      differences:
        value: { typescript: 301.4, vllm-measured: 153.6 }
  - id: default-throughput
    claim: Output tokens per second from the first arrival to the last completion over all 300 requests, the site's default parameters agrees with the measured run.
    kind: calibrated
    metric: throughput_tokens_per_s
    rel_tol: 0.1
    params: defaults
    subset: all
    tolerance: "10 percent: the standard the BLIS timing checks use for throughput; the load is open loop, so throughput differs only through how late the last answers finish."
    known_difference:
      reference: vllm-measured
      cause: "Throughput follows the slower service rate"
      reason: &r_tput >-
        Output tokens per second from the first arrival to the last completion: 590 in the model at default parameters, 1,066 measured (-44.7 percent). The
        load exceeds the engine's capacity throughout, so throughput is the service rate, which is the decode speed (51.4 against 32.4 ms per token).
      differences:
        value: { typescript: 590, vllm-measured: 1066 }
  - id: fitted-ttft-mean
    claim: Mean time to first token over the 200 held-out requests, parameters fitted to the first 100 agrees with the measured run.
