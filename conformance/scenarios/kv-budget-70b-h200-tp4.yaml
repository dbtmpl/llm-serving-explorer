id: kv-budget-70b-h200-tp4
title: KV block budget of one replica, Llama 70B on four H200s
# Tensor parallelism splits the weights and every KV block over the GPUs of a replica; the
# replica's pool is the sum over its GPUs.
model: llama-70b
gpu: h200
engine:
  tp: 4
  gpu_memory_utilisation: 0.9
  max_num_seqs: 12
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
replicas: 1
routing: prefix-aware
requests:
  - { session: 1, at: 1.0, turns: [[200, 20]] }
checks:
  # Owner's decision of 2026-11-16: a capacity both sides derive from estimates is checked within a relative tolerance, not for integer
  # equality. Before it this check was a recorded known difference (74,790 against 74,760 blocks, 0.04%), with the explanation below, kept as it was:
  #
    # The same accounting as kv-budget-8b-h100, per GPU, and the same device memory (an H200's 150,109,880,320 bytes,
    # 139.80 GiB) and CUDA-graph estimate (1,159,725,056 bytes). Two terms remain. The activation peak: BLIS charges 5
    # bf16 hidden-state rows per token for four-way tensor parallelism (671,088,640 bytes), the TypeScript model
    # keeps the residual stream whole and splits only the feed-forward width over four GPUs (634,650,624 bytes): 36.4
    # MB more per GPU in BLIS. And the weights: 35,276,193,792 bytes per GPU in BLIS (it sizes them from the model's
    # graph, including normalisation weights and the rounding of each shard), 35,275,000,000 in the TypeScript model
    # (70.55e9 parameters from the architecture, in BF16, over four). Together 37.6 MB per GPU, over 1,310,720 bytes
    # per GPU-block, 29 blocks, plus one of rounding: 30 blocks (0.04%).
  #
  # The tolerance of 0.1% is set on principle, not to fit the observed difference. Verified on 2026-11-16 that it is the right size: with the model's
  # pool changed by 0.1%, 1% and by 30 blocks, the TypeScript run of every one of the 36 scenarios keeps every decision (placements, cached tokens,
  # preemptions, fates); 35 are bit-for-bit the same and the one built at the edge of its pool (preemption-overflow, 3,601 blocks) changes only times.
  - id: kv-blocks-per-replica
    claim: One tensor-parallel replica holds the same number of KV blocks as the reference, to within 0.1 percent.
    kind: capacity
    quantity: kv_blocks_per_replica
    rel_tol: 0.001
    tolerance: "0.1 percent (decision of 2026-11-16): the terms that remain are estimates on both sides (the activation peak, the rounding of the weights); a difference below one part in a thousand changes no admission decision in any scenario."
    known_difference:
      reference: blis
      cause: "BLIS's flat graph median is above what measured engines set aside; the model follows the measurements"
      reason: &r_kv70 >-
        Same cause as kv-budget-8b-h100, on four GPUs: both use the same driver-reported memory (150,109,880,320 bytes), the same weights (141.1 GB split four ways) and the same block. BLIS charges
        5 hidden-state rows per token of an 8,192-token step for four-way tensor parallelism (671.1 MB) and the flat 1.160 GB for graphs, 1.831 GB per GPU. The model charges a forward pass over
        8,192 tokens with the feed-forward width split four ways (503.3 MB), 9.9 MB of graphs and the empirical 0.7 GB outside PyTorch (src/sim/cost/memory.ts), 1.213 GB per GPU: about 0.62 GB per
        GPU less, 474 blocks more across the pod (+0.6 percent). Not tuned to BLIS.
      differences:
        value: { typescript: 75234, blis: 74760 }
