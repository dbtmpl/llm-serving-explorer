id: kv-budget-70b-h200-tp4
title: KV block budget of one replica, Llama 70B on four H200s
# Tensor parallelism splits the weights and every KV block over the GPUs of a replica; the
# replica's pool is the sum over its GPUs.
model: llama-70b
gpu: h200
engine:
  tp: 4
  gpu_memory_utilisation: 0.9
  max_num_seqs: 12
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
replicas: 1
routing: prefix-aware
requests:
  - { session: 1, at: 1.0, turns: [[200, 20]] }
checks:
  - id: kv-blocks-per-replica
    claim: One tensor-parallel replica holds the same number of KV blocks in both simulators.
    kind: exact
    quantity: kv_blocks_per_replica
    tolerance: Same reason as for one GPU, and tensor parallelism multiplies any per-GPU error by the degree.
    known_difference:
      reason: >-
        The same accounting as kv-budget-8b-h100, per GPU, and the same device memory (an H200's 150,109,880,320 bytes,
        139.80 GiB) and CUDA-graph estimate (1,159,725,056 bytes). Two terms remain. The activation peak: BLIS charges 5
        bf16 hidden-state rows per token for four-way tensor parallelism (671,088,640 bytes), the TypeScript model
        keeps the residual stream whole and splits only the feed-forward width over four GPUs (634,650,624 bytes): 36.4
        MB more per GPU in BLIS. And the weights: 35,276,193,792 bytes per GPU in BLIS (it sizes them from the model's
        graph, including normalisation weights and the rounding of each shard), 35,275,000,000 in the TypeScript model
        (70.55e9 parameters from the architecture, in BF16, over four). Together 37.6 MB per GPU, over 1,310,720 bytes
        per GPU-block, 29 blocks, plus one of rounding: 30 blocks (0.04%).
      differences:
        value: { typescript: 74790, blis: 74760 }
