checks:
  - id: host-tier-hit-rate
    claim: With the tier, a share of prompt tokens is served from host memory; without it, none is.
    kind: directional
    metric: cpu_tier_hit_rate
    baseline: gpu-only
    intervention: with-dram
    effect: difference
    direction: increase
    band: [0.67, 1.5]
    tolerance: "The two simulators' host-tier hit rates must be within a factor of 1.5 of each other: the rate is set by which conversations were evicted and fit in 32 GB, which both decide by least-recently-used order, but BLIS stores whole prompt chunks and not the answer's tokens and the TypeScript model whole conversations, so a few percent of tokens can differ."
  - id: follow-up-time-to-first-token
    claim: A follow-up's time to first token falls when its history is reloaded from host memory instead of recomputed.
    kind: directional
    metric: followup_ttft_mean_s
    baseline: gpu-only
    intervention: with-dram
    effect: ratio
    direction: decrease
    band: [0.75, 1.33]
    tolerance: "The two simulators' ratios (with tier over without) must be within a factor of 1.33 of each other: the saving is the recompute of about 3,000 tokens less a copy at the tier's rate (about 20 GB/s in the TypeScript model, the kernel's price for a DRAM device in BLIS) and both fixed overheads are untouched, so a quarter either way allows for the different copy rates."
