id: tiers-offload
title: Host-memory tier on or off, follow-ups to conversations the GPU has already evicted
# The GPU pool holds about 18 conversations of this size (30 percent memory utilisation, about 57,000 tokens); 30 conversations of 3,050 tokens start one second apart, and
# each is followed up 60 s later in the same order. Under least-recently-used eviction a repeated scan in the same order is the worst case: every follow-up arrives after
# its conversation was evicted. With a 32 GB host-memory tier per replica every conversation is kept (BLIS offloads prompt chunks; the TypeScript model moves whole
# conversations down a tier), so a follow-up reloads its history instead of recomputing it. BLIS evicts chunks and the TypeScript model whole sessions, so hit rates
# and times are compared, not block traces.
model: llama-3.1-8b
gpu: h100
engine:
  tp: 1
  gpu_memory_utilisation: 0.3
  max_num_seqs: 64
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
  max_model_len: 40000
replicas: 1
routing: prefix-aware
arms:
  gpu-only: {}
  with-dram: { offload: { cpu_gb: 32 } }
requests:
  - { session: 1, at: 1.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 2, at: 2.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 3, at: 3.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 4, at: 4.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 5, at: 5.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 6, at: 6.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 7, at: 7.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 8, at: 8.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 9, at: 9.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 10, at: 10.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 11, at: 11.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 12, at: 12.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 13, at: 13.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 14, at: 14.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 15, at: 15.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 16, at: 16.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 17, at: 17.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 18, at: 18.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 19, at: 19.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 20, at: 20.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
  - { session: 21, at: 21.00, gap_s: 60, turns: [[3000, 50], [50, 50]] }
