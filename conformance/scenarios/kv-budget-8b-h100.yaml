id: kv-budget-8b-h100
title: KV block budget of one replica, Llama 3.1 8B on one H100
# One short request, only so that the run has something to replay. The check is about start-up:
# how many 16-token KV blocks the engine finds room for after weights, activations and headroom.
model: llama-3.1-8b
gpu: h100
engine:
  tp: 1
  gpu_memory_utilisation: 0.9
  max_num_seqs: 12
  max_num_batched_tokens: 8192
  block_size: 16
  prefix_caching: true
replicas: 1
routing: prefix-aware
requests:
  - { session: 1, at: 1.0, turns: [[200, 20]] }
checks:
  - id: kv-blocks-per-replica
    claim: One replica holds the same number of KV blocks in both simulators.
    kind: exact
    quantity: kv_blocks_per_replica
    tolerance: A block count is an integer set by memory arithmetic that both simulators state; a few percent of drift would already change when preemption starts, so it is not given any.
    known_difference:
      reason: >-
        Both now follow vLLM's start-up sizing: pool = (ceil(device memory x utilisation) - weights - activation peak -
        CUDA-graph estimate) / block size (vllm/v1/worker/utils.py request_memory; vllm/v1/worker/gpu_worker.py
        determine_available_memory). Both use the memory the CUDA driver reports for an H100 80GB (85,029,158,912 bytes,
        79.19 GiB), the same 1,159,725,056-byte graph estimate (the median of 22 vLLM start-up logs, from the BLIS
        registry), and weights of 16.06 GB and blocks of 2,097,152 bytes. What is left is the activation peak: BLIS
        charges 11 bf16 hidden-state rows per token of a full 8,192-token step (738,197,504 bytes, from NVIDIA's memory
        model through its registry), the TypeScript model sums the residual stream, the feed-forward buffers and the
        sampling logits (735,313,920 bytes). The 2.9 MB difference is 1.4 blocks, and with the rounding of 16,059,990,016
        bytes of real weights against 16.06 GB it makes 2 blocks (0.007%). BLIS's pool, 27,926 blocks, is the figure its
        own run reports; its KV budget routine returns 27,927 before the engine builds the pool.
      differences:
        value: { typescript: 27928, blis: 27926 }
